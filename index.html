<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V-OS: распределённый отель</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eef2;--ink:#12202c;--mut:#5f7080;--card:rgba(255,255,255,.86);--line:rgba(18,32,44,.12);--acc:#2b6cff;--ok:#1f9d74;--warn:#d89a00;--gnd:#d3dee6;--rd:#bfcbd5;--win:#aab9c6;--sh:rgba(18,32,44,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a111d;--ink:#e8edf5;--mut:#8b9bb0;--card:rgba(19,28,46,.86);--line:rgba(255,255,255,.1);--acc:#5b8dff;--gnd:#121b2c;--rd:#1b2740;--win:#26344d;--sh:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0a111d;--ink:#e8edf5;--mut:#8b9bb0;--card:rgba(19,28,46,.86);--line:rgba(255,255,255,.1);--acc:#5b8dff;--gnd:#121b2c;--rd:#1b2740;--win:#26344d;--sh:rgba(0,0,0,.5)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font:500 14px/1.45 Onest,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;transition:transform .15s,background .15s}
button:hover{transform:translateY(-1px)}button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-right:8px}.brand span{color:var(--mut)}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.seg button{border:0;background:none;padding:7px 14px}.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
.stats{display:flex;gap:18px}.stats div{text-align:right}.stats small{display:block;color:var(--mut);font-size:12px}.stats b{font-size:18px;font-weight:800}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}.view.on{display:block}
#city{width:100%;height:100%}
.b{cursor:pointer;transition:transform .25s}.b:hover{transform:translateY(-4px)}.b.sel .t{stroke:var(--ink);stroke-width:2}
.w{fill:var(--win)}.w.busy{fill:#ffcf6e}.w.clean{fill:#bfe6ff}
.nm{font-size:11px;fill:var(--mut);text-anchor:middle;font-weight:700}
.lamp{fill:#ffcf6e;filter:drop-shadow(0 0 5px rgba(255,207,110,.9))}
.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
#toast{position:absolute;left:50%;top:14%;transform:translate(-50%,0);font-size:26px;font-weight:800;color:var(--ok);opacity:0;pointer-events:none}
#toast.go{animation:up 1.3s ease-out}@keyframes up{0%{opacity:0;transform:translate(-50%,16px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}
.sheet{position:fixed;right:16px;bottom:calc(58px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 32px));background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 24px 60px var(--sh);opacity:0;transform:translateY(24px) scale(.97);pointer-events:none;transition:.35s cubic-bezier(.2,.9,.3,1);z-index:5}
.sheet.on{opacity:1;transform:none;pointer-events:auto}
.sheet h3{margin:0 28px 2px 0;font-size:18px;font-weight:800}.sub{margin:0 0 12px;color:var(--mut)}
.q{margin:0 0 12px;padding:10px 12px;border-left:3px solid var(--acc);background:var(--line);border-radius:0 10px 10px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-bottom:14px}.kv span{color:var(--mut)}.kv b{text-align:right}
.btns{display:flex;flex-wrap:wrap;gap:8px}.x{position:absolute;top:10px;right:10px;border:0;background:none;font-size:18px;padding:4px 9px}
.scroll{overflow:auto;height:100%;padding:0 16px 16px}
table{width:100%;border-collapse:collapse;min-width:640px}th{text-align:left;color:var(--mut);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.ban{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 12px;padding:12px 14px;border:1px solid var(--acc);border-radius:14px}
#lg{list-style:none;margin:18px 0 0;padding:0;color:var(--mut)}#lg li{padding:5px 0}#lg b{color:var(--ink)}#lg em{font-style:normal;color:var(--ok)}
#v-focus{display:none;place-items:center}#v-focus.on{display:grid}
.fc{max-width:460px;padding:28px;margin:16px;text-align:center}.fc h2{margin:6px 0;font-size:30px;font-weight:800;letter-spacing:-.02em}.fc p{margin:0 0 20px;color:var(--mut)}.fc small{color:var(--mut)}.fc button{margin:0 4px}
footer{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
footer b{color:var(--ink)}footer em{font-style:normal;color:var(--ok)}
.stats{align-items:center}
.ms{height:200px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:0 0 10px;padding:4px 2px}
.m{max-width:82%;padding:8px 12px;border-radius:16px;font-size:13px}.m.gs{align-self:flex-start;background:var(--line)}.m.me{align-self:flex-end;background:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chips button{padding:5px 10px;font-size:12px;border-radius:999px}
.row{display:flex;gap:8px;margin-bottom:10px}.row input{flex:1;min-width:0;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px}.row input:focus-visible{outline:2px solid var(--acc)}
body[data-w="f"]{--bg:#0d1d15;--ink:#f3ecd6;--mut:#a9bfa0;--card:rgba(18,38,28,.9);--line:rgba(255,255,255,.14);--acc:#e8a93a;--ok:#6fcf7e;--warn:#c9a24a;--gnd:#16301f;--rd:#3a3023;--win:#2a3a2c;--skin:#e2b48a;--sh:rgba(0,0,0,.55);background:radial-gradient(70% 55% at 75% 0%,rgba(255,214,120,.28),transparent),radial-gradient(60% 50% at 10% 100%,rgba(60,160,110,.22),transparent),#0d1d15}
.wd{display:none}body[data-w="f"] .wd{display:block}
.ff{fill:#ffe98a;filter:drop-shadow(0 0 4px #ffe98a);animation:ffl 7s ease-in-out infinite}@keyframes ffl{0%,100%{opacity:.15;transform:translate(0,0)}50%{opacity:1;transform:translate(14px,-18px)}}
.sm{fill:#e9e5d6;opacity:0;animation:sm 3.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes sm{0%{opacity:.75;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(9px,-36px) scale(1.7)}}
.ln{fill:#ffc861;filter:drop-shadow(0 0 5px #ffb740);animation:lt 3s ease-in-out infinite alternate}@keyframes lt{from{opacity:.8}to{opacity:1}}
.cr{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
@media (prefers-reduced-motion:reduce){.ff,.sm,.ln,.cr{animation:none!important}}
.at{animation:atp 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes atp{50%{transform:scale(1.28)}}@media (prefers-reduced-motion:reduce){.at{animation:none}}
#land{position:fixed;inset:0;z-index:-1;pointer-events:none;--hz:22vh}
#land .sky{position:absolute;left:0;right:0;top:0;height:var(--hz)}
#land .hl{position:absolute;left:0;right:0;top:calc(var(--hz) - 30px);height:32px;background:radial-gradient(130px 30px at 12% 100%,var(--hc) 98%,transparent),radial-gradient(170px 38px at 40% 100%,var(--hc) 98%,transparent),radial-gradient(140px 32px at 72% 100%,var(--hc) 98%,transparent),radial-gradient(110px 26px at 94% 100%,var(--hc) 98%,transparent)}
#land .gr{position:absolute;left:0;right:0;top:var(--hz);bottom:0}
.scroll{background:var(--card);border-radius:18px;padding-top:8px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:22px}
.door{fill:#2a3040}
.gh{width:84px;height:84px;flex:none;background:var(--gear) center/contain no-repeat}
.npc{position:fixed;left:16px;right:16px;max-width:540px;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:flex-end;padding:14px 16px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px var(--sh);z-index:7;opacity:0;transform:translateY(30px);pointer-events:none;transition:.35s cubic-bezier(.2,.9,.3,1)}
.npc.on{opacity:1;transform:none;pointer-events:auto}
.nb{flex:1;min-width:0}.nb>b{font-weight:800}.nb p{margin:4px 0 10px;min-height:42px}
.gfab{position:fixed;left:10px;bottom:calc(52px + env(safe-area-inset-bottom,0px));width:120px;height:96px;padding:0;border:0;background:none;z-index:6}.gfab svg{position:absolute;inset:0;width:100%;height:100%}.gfab .gh{position:absolute;left:38px;bottom:6px;width:44px;height:34px;animation:bob 3s ease-in-out infinite}.gfab:hover .gh{filter:brightness(1.1)}
body.nn .gfab .gh{visibility:hidden}
.scan{position:absolute;inset:0;display:none;z-index:4;background:linear-gradient(transparent,rgba(120,190,255,.14))}.scan.on{display:block}
.scan:before{content:"";position:absolute;left:0;right:0;height:3px;background:var(--acc);box-shadow:0 0 24px 6px var(--acc);animation:sw 1.4s ease-in-out infinite alternate}@keyframes sw{from{top:6%}to{top:92%}}
.scan span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700}
.row select{flex:1;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
@keyframes pop{from{opacity:0;transform:translateY(-30px) scale(.9)}}#bl.pop .b{animation:pop .6s backwards}#bl.pop .b:nth-child(2n){animation-delay:.12s}#bl.pop .b:nth-child(3n){animation-delay:.24s}
.sheet{max-height:calc(100% - 150px);overflow:auto}
.cap{display:flex;justify-content:space-between;margin:0 0 6px;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:0 0 12px;font-size:12px;text-align:center}
.cal i{font-style:normal;color:var(--mut);font-size:11px}
.cal b{font-weight:500;padding:5px 0;border-radius:8px;min-height:27px}
.cal b.bk{background:var(--acc);color:#fff}.cal b.ou{background:linear-gradient(135deg,var(--acc) 50%,transparent 50%)}.cal b.td{outline:2px solid var(--ink)}.cal b.pa{opacity:.45}
.wsg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.wsg button{border:0;background:none;padding:7px 14px}.wsg button.on{background:var(--ink);color:var(--bg);font-weight:700}
body[data-w="g"]{--bg:#17213f;--ink:#fff4e4;--mut:#aebbe0;--card:rgba(30,41,82,.9);--line:rgba(255,255,255,.16);--acc:#e0485a;--ok:#3cb37a;--warn:#f0b43a;--gnd:#e6eef9;--rd:#d7c2a1;--win:#6b3f1d;--skin:#c98a4b;--sh:rgba(0,0,0,.5);background:radial-gradient(120% 90% at 50% 0%,#2a3a72,#17213f)}
body[data-w="g"] .door{fill:#5a3418}
.sf{fill:#fff;opacity:.9;animation:fall linear infinite}@keyframes fall{to{transform:translate(24px,500px)}}
body[data-w="s"]{--bg:#070b1f;--ink:#e9eeff;--mut:#8e9bd0;--card:rgba(14,20,50,.9);--line:rgba(255,255,255,.15);--acc:#7a5cff;--ok:#1fc99a;--warn:#ffb020;--win:#27345f;--sh:rgba(0,0,0,.6);background:radial-gradient(60% 50% at 85% 5%,rgba(122,92,255,.32),transparent),radial-gradient(55% 45% at 10% 95%,rgba(20,150,200,.28),transparent),#070b1f}
body[data-w="s"] #gst>:nth-child(n+2):nth-child(-n+5){display:none}
.al{display:none}body[data-w="s"] .al{display:block;transform-box:fill-box;transform-origin:center;animation:fl 2.2s ease-in-out infinite alternate}
.fl{transform-box:fill-box;transform-origin:center;animation:fl 6s ease-in-out infinite alternate}@keyframes fl{from{transform:translate(0,4px) rotate(-1.4deg)}to{transform:translate(0,-9px) rotate(1.4deg)}}
.st{animation:tw 3.5s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}.bl{fill:#ff5a6e;animation:tw 1.6s infinite}
@media (prefers-reduced-motion:reduce){.fl,.st,.bl,.al{animation:none!important}}
@media (prefers-reduced-motion:reduce){.sf{animation:none}}
@media (prefers-reduced-motion:reduce){.bob,#toast.go{animation:none}.b,button{transition:none}}

const CL=["Анна","Олег"];
function out(id){const o=S.objs[id];push("Выселение: "+o.g.n+", "+o.name,"PMS ← статус «Уборка»");{const c=o.bk.find(b=>b.a<=T&&T<b.b);if(c){c.b=T;if(c.b<=c.a)o.bk.splice(o.bk.indexOf(c),1)}}o.st="clean";o.g=null;o.chat=null;o.cl="need";if(S.cfg.asg==="auto")assign(id,true);else refresh()}
function assign(id,a){const o=S.objs[id];o.cl="work";o.cleaner=CL[S.n%2];push((a?"Уборщица назначена автоматически: ":"Уборщица назначена: ")+o.cleaner+", "+o.name,"Telegram ← задание уборщице");

function code(id){const o=S.objs[id];o.code=1;say(o,"Код доступа: "+(4000+id*137)+". Адрес и инструкция выше.");push("Код доступа отправлен: "+o.g.n,chn(o)+" ← сообщение гостю");refresh()}

function toast(t){const e=$("#toast");e.textContent=t;e.classList.remove("go");void e.offsetWidth;e.classList.add("go")}

function th(o){return o.chat||(o.chat=[{f:"g",t:"Здравствуйте! Подскажите, как заселиться?"}])}

function chn(o){return o.g?o.g.ch:"Telegram"}
function cur(){const o=S.cs==="r"?S.req:S.objs[S.sel];return o&&(S.cs==="r"||o.g)?o:null}
function msgs(){const e=$("#ms"),o=cur();if(!e||!o)return;e.innerHTML=th(o).map(m=>`<div class="m ${m.f==="g"?"gs":"me"}">${esc(m.t)}</div>`).join("");e.scrollTop=e.scrollHeight}
function send(t){const i=$("#ci"),x=t||(i&&i.value.trim()),o=cur();if(!x||!o)return;if(i)i.value="";say(o,x);const ch=S.cs==="r"?o.ch:chn(o);push(esc("Сообщение гостю: "+x.slice(0,40)),ch+" ← сообщение");msgs();foot();desk();const a=th(o);setTimeout(()=>{a.push({f:"g",t:RP[a.length%RP.length]});if(S.sheet==="c")msgs()},1100)}
function quick(i){const o=cur();if(!o)return;if(i===0)code(o.id);else send(i===1?"Отправляю адрес и инструкцию: вход со двора, второй этаж, лифт слева.":"Во сколько планируете заезд?")}
function openChat(k){S.cs=k;S.sheet="c";refresh()}

function chatHtml(){const o=cur(),r=S.cs==="r",chips=(r||o.code?"":`<button onclick="quick(0)">Отправить код</button>`)+`<button onclick="quick(1)">Адрес и инструкция</button><button onclick="quick(2)">Во сколько заезд?</button>`;
  return `<h3>${esc(r?o.n:o.g.n)}</h3><p class="sub">${r?o.ch:chn(o)}: демо-чат, подключение через API</p><div id="ms" class="ms"></div><div class="chips">${chips}</div><div class="row"><input id="ci" placeholder="Сообщение гостю" onkeydown="if(event.key==='Enter')send()"><button class="p" onclick="send()">Отправить</button></div><div class="btns"><button onclick="backTo()">Назад</button></div>`}
function cfgHtml(){const c=S.cfg,t=(k,v,l)=>`<button class="${c[k]===v?"p":""}" onclick="S.cfg.${k}='${v}';refresh()">${l}</button>`;
  return `<h3>Правила уборки</h3><p class="sub">У каждого арендодателя свои. Выберите, как у вас.</p><p class="sub">Назначение уборщицы</p><div class="btns">${t("asg","auto","Автоматически")}${t("asg","manual","Вручную")}</div><p class="sub" style="margin-top:14px">Приёмка уборки</p><div class="btns">${t("acc","auto","Автоматически")}${t("acc","manual","Вручную")}</div>`}
const PAL=["#9db4d6","#c7b8e0","#a8d3c4","#e6c6a8","#b9c7d9","#d9b8c4"],SL=[[0,0],[6.2,0],[12.4,0],[0,6.2],[6.2,6.2],[12.4,6.2]],SN=["сверху слева","сверху по центру","сверху справа","снизу слева","снизу по центру","снизу справа"];
let ty;function typ(t){clearInterval(ty);const e=$("#nt");let i=0;e.textContent="";ty=setInterval(()=>{e.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(ty)},18)}
const N={s:0,i:0,d:{ch:[]}},LN=["Привет! Я Шестеренкоголовый, механик твоего мира.","Настрою бизнес в два клика.","Шестёренки провернулись: данные подключены, объекты расставлены на карте!","Остальное могу подтянуть из PMS и Авито."];
function talk(){N.s=6;document.body.classList.add("nn");$("#npc").classList.add("on");S.sheet=null;refresh();nr()}
function nxt(){N.i++;nr()}
function att(o){const [x,y]=P(o.gx+1,o.gy+1,o.h+(S.world==="space"?66:S.world==="forest"?54:S.world==="city"?32:40));return `<g data-id="${o.id}" style="cursor:pointer" transform="translate(${x+66},${y-19})"><g class="at"><circle r="11" fill="#e5484d" stroke="#fff" stroke-width="1.5"/><text y="4.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">!</text></g></g>`}
function npc(s){N.s=s;if(s===0)N.d={ch:[]};document.body.classList.add("nn");$("#npc").classList.add("on");S.sheet=null;refresh();nr()}

function tg(x){const i=$("#ni");if(i)N.d.ical=i.value;const a=N.d.ch,k=a.indexOf(x);k<0?a.push(x):a.splice(k,1);nr(1)}
function nr(k){
  const s=N.s,d=N.d,en=`onkeydown="if(event.key==='Enter')nx()"`,T0=["Привет! Я Шестеренкоголовый, механик твоего мира. Настрою бизнес в два клика. Начнём с чистого листа?","Как называется твой первый объект?","Сколько стоит ночь в этом объекте, ₽?","Откуда приходят брони? Отметь каналы, iCal-ссылку можно вставить сразу.","Готово! «"+(d.name||"")+"» уже на карте. Остальное могу подтянуть из PMS и Авито (в демо на демо-данных)."];

  else if(s===4)c=`<button class="p" onclick="imp()">Импортировать из PMS / Авито</button><button onclick="nc()">Смотреть мир</button>`;

  if(N.s===1){if(!v){i.focus();return}N.d.name=v}
  else if(N.s===2)N.d.price=Math.max(500,+v||5200);
  else if(N.s===3){N.d.ical=v;addO(N.d.name,N.d.price,v,0,true)}

function addO(name,price,ical,slot,reset){if(reset){S.objs=[];S.req=null;G=null;S.sheet=null}
  const id=S.objs.length;S.objs.push({id,name,gx:SL[slot][0],gy:SL[slot][1],h:56+id*4%20,c:PAL[id%6],price,st:"free",bk:[],ical});refresh()}
function wHtml(){const fr=SL.map((p,i)=>i).filter(i=>!S.objs.some(o=>o.gx===SL[i][0]&&o.gy===SL[i][1]));
  return `<h3>Настройка мира</h3><p class="sub">Объектов: ${S.objs.length} из 6</p>`+S.objs.map(o=>`<div class="kv"><b style="text-align:left">${esc(o.name)}</b><span style="text-align:right">${fmt(o.price)} ₽ <button onclick="delO(${o.id})" aria-label="Удалить">×</button></span></div>`).join("")+
  (fr.length?`<p class="sub">Новый объект</p><div class="row"><input id="wn" placeholder="Название"><input id="wp" type="number" placeholder="₽ за ночь" style="max-width:110px"></div><div class="row"><select id="ws">${fr.map(i=>`<option value="${i}">место: ${SN[i]}</option>`).join("")}</select></div><div class="row"><input id="wi" placeholder="iCal-ссылка (в демо не загружается)"></div><div class="btns"><button class="p" onclick="addW()">Добавить на карту</button></div>`:"")+
  `<p class="sub" style="margin-top:14px">Мир</p><div class="chips">${[["forest","Живой лес"],["city","Город"],["ginger","Пряничный"],["space","Космос"]].map(([k,l])=>`<button class="${S.world===k?"p":""}" onclick="S.world='${k}';S.fw=1;refresh()">${l}</button>`).join("")}</div><div class="btns"><button class="p" onclick="imp2()">Импортировать из PMS / Авито</button><button onclick="npc(0)">Первый запуск с нуля</button></div>`}

function imp(){nc();$("#scan").classList.add("on");const L=["Подключаю PMS…","Читаю календари и чаты Авито…","Расставляю объекты на карте…"],e=$("#sct");let i=0;e.textContent=L[0];const t=setInterval(()=>{if(++i<L.length)e.textContent=L[i];else clearInterval(t)},1100);
  setTimeout(()=>{$("#scan").classList.remove("on");S.objs=JSON.parse(DEMO);S.req=null;G=null;S.sheet=null;refresh();$("#bl").classList.add("pop");setTimeout(()=>$("#bl").classList.remove("pop"),1400);setTimeout(()=>npc(5),600);setTimeout(spawn,7000)},3400)}

function drawSheet(){
  const el=$("#sheet");let h="";if(S.sheet==="c"&&!cur())S.sheet=null;if(S.sheet==="c"&&el.dataset.k==="c"){msgs();return}if(S.sheet==="w"&&el.dataset.k==="w"&&!S.fw)return;S.fw=0;el.dataset.k=S.sheet||"";

document.querySelectorAll(".wsg button").forEach(b=>b.onclick=()=>{S.world=b.dataset.w;refresh()});
