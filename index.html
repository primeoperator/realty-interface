<html lang="ru">
<head>

<title>V-OS: распределённый отель</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eef2;--ink:#12202c;--mut:#5f7080;--card:rgba(255,255,255,.86);--line:rgba(18,32,44,.12);--acc:#2b6cff;--ok:#1f9d74;--warn:#d89a00;--gnd:#d3dee6;--rd:#bfcbd5;--win:#aab9c6;--sh:rgba(18,32,44,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a111d;--ink:#e8edf5;--mut:#8b9bb0;--card:rgba(19,28,46,.86);--line:rgba(255,255,255,.1);--acc:#5b8dff;--gnd:#121b2c;--rd:#1b2740;--win:#26344d;--sh:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0a111d;--ink:#e8edf5;--mut:#8b9bb0;--card:rgba(19,28,46,.86);--line:rgba(255,255,255,.1);--acc:#5b8dff;--gnd:#121b2c;--rd:#1b2740;--win:#26344d;--sh:rgba(0,0,0,.5)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font:500 14px/1.45 Onest,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;transition:transform .15s,background .15s}
button:hover{transform:translateY(-1px)}button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-right:8px}.brand span{color:var(--mut)}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.seg button{border:0;background:none;padding:7px 14px}.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
.stats{display:flex;gap:18px}.stats div{text-align:right}.stats small{display:block;color:var(--mut);font-size:12px}.stats b{font-size:18px;font-weight:800}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}.view.on{display:block}
#city{width:100%;height:100%}
.b{cursor:pointer;transition:transform .25s}.b:hover{transform:translateY(-4px)}.b.sel .t{stroke:var(--ink);stroke-width:2}
.w{fill:var(--win)}.w.busy{fill:#ffcf6e}.w.clean{fill:#bfe6ff}
.nm{font-size:11px;fill:var(--mut);text-anchor:middle;font-weight:700}
.lamp{fill:#ffcf6e;filter:drop-shadow(0 0 5px rgba(255,207,110,.9))}

#toast.go{animation:up 1.3s ease-out}@keyframes up{0%{opacity:0;transform:translate(-50%,16px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}
.sheet{position:fixed;right:16px;bottom:calc(58px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 32px));background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 24px 60px var(--sh);opacity:0;transform:translateY(24px) scale(.97);pointer-events:none;transition:.35s cubic-bezier(.2,.9,.3,1);z-index:5}
.sheet.on{opacity:1;transform:none;pointer-events:auto}
.sheet h3{margin:0 28px 2px 0;font-size:18px;font-weight:800}.sub{margin:0 0 12px;color:var(--mut)}
.q{margin:0 0 12px;padding:10px 12px;border-left:3px solid var(--acc);background:var(--line);border-radius:0 10px 10px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-bottom:14px}.kv span{color:var(--mut)}.kv b{text-align:right}
.btns{display:flex;flex-wrap:wrap;gap:8px}.x{position:absolute;top:10px;right:10px;border:0;background:none;font-size:18px;padding:4px 9px}
.scroll{overflow:auto;height:100%;padding:0 16px 16px}
table{width:100%;border-collapse:collapse;min-width:640px}th{text-align:left;color:var(--mut);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.ban{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 12px;padding:12px 14px;border:1px solid var(--acc);border-radius:14px}
#lg{list-style:none;margin:18px 0 0;padding:0;color:var(--mut)}#lg li{padding:5px 0}#lg b{color:var(--ink)}#lg em{font-style:normal;color:var(--ok)}
#v-focus{display:none;place-items:center}#v-focus.on{display:grid}
.fc{max-width:460px;padding:28px;margin:16px;text-align:center}.fc h2{margin:6px 0;font-size:30px;font-weight:800;letter-spacing:-.02em}.fc p{margin:0 0 20px;color:var(--mut)}.fc small{color:var(--mut)}.fc button{margin:0 4px}
footer{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
footer b{color:var(--ink)}footer em{font-style:normal;color:var(--ok)}
.stats{align-items:center}
.ms{height:200px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:0 0 10px;padding:4px 2px}
.m{max-width:82%;padding:8px 12px;border-radius:16px;font-size:13px}.m.gs{align-self:flex-start;background:var(--line)}.m.me{align-self:flex-end;background:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chips button{padding:5px 10px;font-size:12px;border-radius:999px}
.row{display:flex;gap:8px;margin-bottom:10px}.row input{flex:1;min-width:0;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px}.row input:focus-visible{outline:2px solid var(--acc)}
.door{fill:#2a3040}
.sheet{max-height:calc(100% - 150px);overflow:auto}
.cap{display:flex;justify-content:space-between;margin:0 0 6px;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:0 0 12px;font-size:12px;text-align:center}
.cal i{font-style:normal;color:var(--mut);font-size:11px}
.cal b{font-weight:500;padding:5px 0;border-radius:8px;min-height:27px}
.cal b.bk{background:var(--acc);color:#fff}.cal b.ou{background:linear-gradient(135deg,var(--acc) 50%,transparent 50%)}.cal b.td{outline:2px solid var(--ink)}.cal b.pa{opacity:.45}
.wsg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.wsg button{border:0;background:none;padding:7px 14px}.wsg button.on{background:var(--ink);color:var(--bg);font-weight:700}
body[data-w="g"]{--bg:#17213f;--ink:#fff4e4;--mut:#aebbe0;--card:rgba(30,41,82,.9);--line:rgba(255,255,255,.16);--acc:#e0485a;--ok:#3cb37a;--warn:#f0b43a;--gnd:#e6eef9;--rd:#d7c2a1;--win:#6b3f1d;--skin:#c98a4b;--sh:rgba(0,0,0,.5);background:radial-gradient(120% 90% at 50% 0%,#2a3a72,#17213f)}

.sf{fill:#fff;opacity:.9;animation:fall linear infinite}@keyframes fall{to{transform:translate(24px,500px)}}
body[data-w="s"]{--bg:#070b1f;--ink:#e9eeff;--mut:#8e9bd0;--card:rgba(14,20,50,.9);--line:rgba(255,255,255,.15);--acc:#7a5cff;--ok:#1fc99a;--warn:#ffb020;--win:#27345f;--sh:rgba(0,0,0,.6);background:radial-gradient(60% 50% at 85% 5%,rgba(122,92,255,.32),transparent),radial-gradient(55% 45% at 10% 95%,rgba(20,150,200,.28),transparent),#070b1f}
body[data-w="s"] #gst>:nth-child(n+2):nth-child(-n+5){display:none}
.al{display:none}body[data-w="s"] .al{display:block;transform-box:fill-box;transform-origin:center;animation:fl 2.2s ease-in-out infinite alternate}
.fl{transform-box:fill-box;transform-origin:center;animation:fl 6s ease-in-out infinite alternate}@keyframes fl{from{transform:translate(0,4px) rotate(-1.4deg)}to{transform:translate(0,-9px) rotate(1.4deg)}}
.st{animation:tw 3.5s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}.bl{fill:#ff5a6e;animation:tw 1.6s infinite}
@media (prefers-reduced-motion:reduce){.fl,.st,.bl,.al{animation:none!important}}
@media (prefers-reduced-motion:reduce){.sf{animation:none}}
@media (prefers-reduced-motion:reduce){.bob,#toast.go{animation:none}.b,button{transition:none}}
</style>
</head>
<body>

    </svg>

  <section class="view" id="v-desk"><div class="scroll"><div id="bn"></div><table><thead><tr><th>Объект</th><th>Статус</th><th>Гость</th><th>Канал</th><th>Сумма</th><th></th></tr></thead><tbody id="tb"></tbody></table><ul id="lg"></ul></div></section>
  <section class="view" id="v-focus"><div class="fc" id="fc"></div></section>
</main>
<aside class="sheet" id="sheet" aria-live="polite"></aside>
<footer><span id="ft"></span><span>Демо-данные, PMS имитируется</span></footer>

const SC=["#cfd8e6","#e4d9c6","#c7e0e0","#d8cfe6","#e6d2d2","#d3e3c8"];
function gs(o){
  const i=o.id,h=o.h+10,[cx,cy]=P(o.gx+1,o.gy+1,o.h*.5+34),m=SC[i%6],rw=36+i%3*4,n=Math.max(2,Math.floor(h/20)),
  win=[...Array(n)].map((_,j)=>`<circle class="w ${o.st}" cx="0" cy="${-h/2+14+j*18}" r="3.4" stroke="#fff" stroke-width="1.2"/>`).join(""),
  pn=[-1,1].map(k=>{const px=k>0?rw-4:-rw-18;return `<line x1="${k*17}" y1="${-h/2+12}" x2="${k*(rw-4)}" y2="${-h/2+12}" stroke="#9aa8c4" stroke-width="2"/><rect x="${px}" y="${-h/2+3}" width="22" height="18" rx="2" fill="#2650b0" stroke="#8fb4ff" stroke-width=".8"/><rect x="${px}" y="${-h/2+3}" width="22" height="18" rx="2" fill="url(#sp)"/>`}).join("");
  return `<g class="b${S.sel===i?" sel":""}" data-id="${i}" data-d="${o.gx+o.gy+2}"><g transform="translate(${cx},${cy})"><g class="fl" style="animation-delay:-${i*1.7}s"><ellipse rx="${rw}" ry="13" fill="none" stroke="${shade(m,-.45)}" stroke-width="6"/>${pn}<rect class="t" x="-17" y="${-h/2}" width="34" height="${h}" rx="15" fill="${m}"/><rect x="-14" y="${-h/2+6}" width="7" height="${h-12}" rx="3.5" fill="#fff" opacity=".4"/><rect x="6" y="${-h/2+4}" width="11" height="${h-8}" rx="5" fill="#000" opacity=".14"/>${win}<path d="M${-rw} 0A${rw} 13 0 0 0 ${rw} 0" fill="none" stroke="${m}" stroke-width="6" stroke-linecap="round"/><line x1="0" y1="${-h/2}" x2="0" y2="${-h/2-14}" stroke="#dfe7f5"/><circle class="bl" cy="${-h/2-16}" r="2.4"/></g></g>${pinS(o)}</g>`}
function spaceBg(){let s="";for(let i=0;i<90;i++)s+=`<circle cx="${i*131%800}" cy="${i*67%490}" r="${.6+i%3*.5}" fill="#fff" class="st" style="animation-delay:-${i%7}s"/>`;s+=`<circle cx="120" cy="95" r="46" fill="url(#pl)"/><ellipse cx="120" cy="95" rx="78" ry="13" fill="none" stroke="#ffd9a8" stroke-opacity=".5" stroke-width="3" transform="rotate(-16 120 95)"/>`;for(const y of[4.1,10.3])s+=`<polyline fill="none" stroke="#7a8cff" stroke-opacity=".3" stroke-dasharray="6 9" points="${pt([P(-1.2,y),P(14.6,y)])}"/>`;return s}
function lbl(o){return o.st==="clean"?(o.cl==="need"?"Назначить":o.cl==="work"?"Убирают":"Проверить"):ST[o.st][0]}
function ground(){if(S.world==="space")return spaceBg();
  const q=(x0,y0,x1,y1,f)=>`<polygon fill="${f}" points="${pt([P(x0,y0),P(x1,y0),P(x1,y1),P(x0,y1)])}"/>`;
  let s=q(-1.2,-1.2,14.6,11.4,"var(--gnd)")+q(-1.2,2,14.6,6.2,"var(--rd)")+q(-1.2,8.2,14.6,11.4,"var(--rd)")+q(2,-1.2,6.2,11.4,"var(--rd)")+q(8.2,-1.2,12.4,11.4,"var(--rd)");
  for(const [x,y] of [[4.1,4.1],[10.3,4.1],[4.1,9.8],[10.3,9.8]]){const [a,b]=P(x,y);s+=`<g transform="translate(${a},${b})"><line y2="-24" stroke="var(--mut)" stroke-width="2"/><circle cy="-26" r="4" class="lamp"/></g>`}
  for(const [x,y] of [[-.6,.8],[15,1],[-.6,7],[15,7],[4.1,-.6],[10.3,-.6],[4.1,11],[10.3,11]]){const [a,b]=P(x,y);s+=`<g transform="translate(${a},${b})"><rect x="-2" y="-12" width="4" height="12" fill="#7a5d46"/>${S.world==="ginger"?"<polygon points='-13,-8 13,-8 0,-30' fill='#2f7d4f'/><polygon points='-10,-20 10,-20 0,-40' fill='#3a8f5c'/><polygon points='-6,-31 6,-31 0,-50' fill='#46a06a'/><circle cx='-4' cy='-17' r='1.6' fill='#ff5a6e'/><circle cx='5' cy='-28' r='1.6' fill='#ffd24a'/><circle cx='-2' cy='-38' r='1.5' fill='#6bc4ff'/><polygon points='-3,-44 3,-44 0,-50' fill='#fff'/>":"<circle cy='-20' r='10' fill='#5e9c7c'/>"}</g>`}
  return s}

function bld(o){if(S.world==="ginger")return gb(o);if(S.world==="space")return gs(o);
  const x=o.gx,y=o.gy,h=o.h,s=2,f={L:(t,z)=>P(x+t*s,y+s,z),R:(t,z)=>P(x+s,y+s-t*s,z)};
  const q=(k,a,b,c,d)=>pt([f[k](a,d),f[k](b,d),f[k](b,c),f[k](a,c)]);
  let w="";const fl=Math.floor((h-14)/28);
  for(let i=0;i<fl;i++)for(const k of ["L","R"])for(const t of [.16,.58])w+=`<polygon class="w ${o.st}" points="${q(k,t,t+.26,12+i*28,28+i*28)}"/>`;
  const [px,py]=P(x+1,y+1,h+32),[nx,ny]=P(x+1,y+s+.55,0),col=ST[o.st][1],lab=lbl(o);
  return `<g class="b${S.sel===o.id?" sel":""}" data-id="${o.id}" data-d="${o.gx+o.gy+2}">
<polygon fill="${shade(o.c,-.1)}" points="${pt([P(x,y+s,h),P(x+s,y+s,h),P(x+s,y+s,0),P(x,y+s,0)])}"/>
<polygon fill="${shade(o.c,-.28)}" points="${pt([P(x+s,y+s,h),P(x+s,y,h),P(x+s,y,0),P(x+s,y+s,0)])}"/>
<polygon class="t" fill="${shade(o.c,.14)}" points="${pt([P(x,y,h),P(x+s,y,h),P(x+s,y+s,h),P(x,y+s,h)])}"/>${w}
<polygon class="door" points="${q("L",.43,.57,0,22)}"/>
<g transform="translate(${px},${py})"><g class="bob"><rect x="-66" y="-19" width="132" height="36" rx="12" style="fill:${col}"/><text y="-4" text-anchor="middle" fill="${o.st==="clean"?"#1b1400":"#fff"}" font-size="11" font-weight="800">${o.name}</text><text y="10" text-anchor="middle" fill="${o.st==="clean"?"#1b1400":"#fff"}" font-size="10">${lab}${dl(o)?" · "+dl(o):""}</text></g></g></g>`}

let G=null,last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000),el=$("#gst");last=now;let fin=null;
  if(G){
    if(G.wp.length){const [tx,ty]=G.wp[0],dx=tx-G.x,dy=ty-G.y,d=Math.hypot(dx,dy),st=2.2*dt;
      if(d<=st){G.x=tx;G.y=ty;G.wp.shift();if(!G.wp.length&&G.after){fin=G.after;G.after=null}}else{G.x+=dx/d*st;G.y+=dy/d*st}}
    const [sx,sy]=P(G.x,G.y),b=G.wp.length?Math.abs(Math.sin(now/110))*3:0;
    el.setAttribute("transform",`translate(${sx},${sy-b})`);el.style.display="";$("#bub").style.display=G.mode==="wait"?"":"none";
    el.style.opacity=G.door?Math.min(1,Math.hypot(G.x-G.door[0],G.y-G.door[1])/.7):1;
    const bl=$("#bl"),dp=G.x+G.y,ref=[...bl.querySelectorAll(".b")].find(k=>+k.dataset.d>dp)||null;if(el.parentNode!==bl||el.nextElementSibling!==ref)bl.insertBefore(el,ref);
  }else el.style.display="none";
  if(fin)fin();requestAnimationFrame(tick)}

function spawn(){
  if(G)return;const fr=S.objs.filter(o=>o.st==="free");
  if(!fr.length){toast("Все объекты заняты");return}
  const o=fr[Math.random()*fr.length|0],nm=S.world==="space"?["Зорк из Альфа Центавры","Лиррр-Мо","Ксю с Тау Кита","Облако Блуп","Вьюн-7"]:["Артём С.","Алина М.","Игорь Л.","Светлана Б.","Евгений Т."],ch=["Booking","Авито","Суточно","Telegram"],nights=2+(Math.random()*3|0),ry=o.gy+4.1;
  S.req={o,n:nm[Math.random()*nm.length|0],nights,sum:o.price*nights,ch:ch[Math.random()*ch.length|0],chat:[{f:"g",t:"Здравствуйте! Свободно на "+nights+" ночи? Готов оплатить сразу."}]};
  $("#gst").style.setProperty("--al",["#7af0c8","#ff9de1","#ffd36b","#8fb7ff","#b6ff7a"][Math.random()*5|0]);G={x:-.8,y:ry,wp:[[o.gx+1,ry]],mode:"in",after:()=>{G.mode="wait";openReq()}};
  render()}
function later(){setTimeout(()=>{if(!G&&!S.req)spawn()},7000)}
function accept(){
  const r=S.req;if(!r)return;const o=r.o;
  o.st="busy";o.g={n:r.n,to:"до "+(T+r.nights)+" ноября",sum:r.sum,ch:r.ch};o.bk.push({a:T,b:T+r.nights,n:r.n});o.code=0;o.chat=r.chat.concat([{f:"m",t:"Бронь подтверждена, жду вас!"}]);S.week+=r.sum;S.n++;S.req=null;
  G.mode="enter";G.door=[o.gx+1,o.gy+2.15];G.wp=[G.door];G.after=()=>{G=null};
  push("Бронь подтверждена: "+r.n+", "+o.name,"PMS ← бронь №"+S.n);toast("+"+fmt(r.sum)+" ₽");S.sheet=null;S.sel=null;refresh();later()}
function reject(){
  const r=S.req;if(!r)return;S.req=null;G.mode="leave";G.wp=[[-1,G.y]];G.after=()=>{G=null};
  push("Заявка отклонена: "+r.n,"PMS ← заявка закрыта");S.sheet=null;refresh();later()}
const CL=["Анна","Олег"];
function out(id){const o=S.objs[id];push("Выселение: "+o.g.n+", "+o.name,"PMS ← статус «Уборка»");{const c=o.bk.find(b=>b.a<=T&&T<b.b);if(c){c.b=T;if(c.b<=c.a)o.bk.splice(o.bk.indexOf(c),1)}}o.st="clean";o.g=null;o.chat=null;o.cl="need";if(S.cfg.asg==="auto")assign(id,true);else refresh()}
function assign(id,a){const o=S.objs[id];o.cl="work";o.cleaner=CL[S.n%2];push((a?"Уборщица назначена автоматически: ":"Уборщица назначена: ")+o.cleaner+", "+o.name,"Telegram ← задание уборщице");
  setTimeout(()=>{if(o.st==="clean"&&o.cl==="work"){o.cl="check";push("Уборка завершена: "+o.name+", фото получены","Telegram ← "+o.cleaner);if(S.cfg.acc==="auto")done(id,true);else refresh()}},6000);refresh()}
function done(id,a){const o=S.objs[id];o.st="free";o.cl=null;push((a?"Уборка принята автоматически: ":"Уборка принята: ")+o.name,"PMS ← объект свободен");refresh();later()}
function code(id){const o=S.objs[id];o.code=1;say(o,"Код доступа: "+(4000+id*137)+". Адрес и инструкция выше.");push("Код доступа отправлен: "+o.g.n,chn(o)+" ← сообщение гостю");refresh()}
function push(a,b){S.log.unshift({t:new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}),a,b});S.log.length=Math.min(S.log.length,20)}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.remove("go");void e.offsetWidth;e.classList.add("go")}
let shown=S.week;
function count(){const e=$("#wk"),t=S.week;(function s(){shown+=Math.ceil((t-shown)/6);e.textContent=fmt(shown)+" ₽";if(shown<t)requestAnimationFrame(s)})()}

const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const RP=["Спасибо!","Отлично, поняла.","Хорошо, буду к 15:00.","Супер, до встречи!"];
function th(o){return o.chat||(o.chat=[{f:"g",t:"Здравствуйте! Подскажите, как заселиться?"}])}
function say(o,t){th(o).push({f:"m",t})}
function chn(o){return o.g?o.g.ch:"Telegram"}
function cur(){const o=S.cs==="r"?S.req:S.objs[S.sel];return o&&(S.cs==="r"||o.g)?o:null}
function msgs(){const e=$("#ms"),o=cur();if(!e||!o)return;e.innerHTML=th(o).map(m=>`<div class="m ${m.f==="g"?"gs":"me"}">${esc(m.t)}</div>`).join("");e.scrollTop=e.scrollHeight}
function send(t){const i=$("#ci"),x=t||(i&&i.value.trim()),o=cur();if(!x||!o)return;if(i)i.value="";say(o,x);const ch=S.cs==="r"?o.ch:chn(o);push(esc("Сообщение гостю: "+x.slice(0,40)),ch+" ← сообщение");msgs();foot();desk();const a=th(o);setTimeout(()=>{a.push({f:"g",t:RP[a.length%RP.length]});if(S.sheet==="c")msgs()},1100)}
function quick(i){const o=cur();if(!o)return;if(i===0)code(o.id);else send(i===1?"Отправляю адрес и инструкцию: вход со двора, второй этаж, лифт слева.":"Во сколько планируете заезд?")}
function openChat(k){S.cs=k;S.sheet="c";refresh()}
function backTo(){S.sheet=S.cs==="r"?"r":"o";refresh()}
function chatHtml(){const o=cur(),r=S.cs==="r",chips=(r||o.code?"":`<button onclick="quick(0)">Отправить код</button>`)+`<button onclick="quick(1)">Адрес и инструкция</button><button onclick="quick(2)">Во сколько заезд?</button>`;
  return `<h3>${esc(r?o.n:o.g.n)}</h3><p class="sub">${r?o.ch:chn(o)}: демо-чат, подключение через API</p><div id="ms" class="ms"></div><div class="chips">${chips}</div><div class="row"><input id="ci" placeholder="Сообщение гостю" onkeydown="if(event.key==='Enter')send()"><button class="p" onclick="send()">Отправить</button></div><div class="btns"><button onclick="backTo()">Назад</button></div>`}
function cfgHtml(){const c=S.cfg,t=(k,v,l)=>`<button class="${c[k]===v?"p":""}" onclick="S.cfg.${k}='${v}';refresh()">${l}</button>`;
  return `<h3>Правила уборки</h3><p class="sub">У каждого арендодателя свои. Выберите, как у вас.</p><p class="sub">Назначение уборщицы</p><div class="btns">${t("asg","auto","Автоматически")}${t("asg","manual","Вручную")}</div><p class="sub" style="margin-top:14px">Приёмка уборки</p><div class="btns">${t("acc","auto","Автоматически")}${t("acc","manual","Вручную")}</div>`}
function openCfg(){S.sheet="cfg";refresh()}
function openObj(id){S.sel=id;S.sheet="o";refresh()}
function openReq(){S.sel=null;S.sheet="r";refresh()}
function closeSheet(){S.sheet=null;S.sel=null;refresh()}
function refresh(){render();drawSheet()}
function drawSheet(){
  const el=$("#sheet");let h="";if(S.sheet==="c"&&!cur())S.sheet=null;if(S.sheet==="c"&&el.dataset.k==="c"){msgs();return}el.dataset.k=S.sheet||"";
  if(S.sheet==="r"&&S.req){const r=S.req;
    h=`<h3>Новая заявка</h3><p class="sub">${r.ch}, ${r.o.name}</p><p class="q">«Здравствуйте! Свободно на ${r.nights} ночи? Готов оплатить сразу.»</p><div class="kv"><span>Гость</span><b>${r.n}</b><span>Даты</span><b>${T}.11–${T+r.nights}.11</b><span>Сумма</span><b>${fmt(r.sum)} ₽</b></div><div class="btns"><button class="p" onclick="accept()">Заселить гостя</button><button onclick="reject()">Отклонить</button><button onclick="openChat('r')">Чат</button></div>`}
  else if(S.sheet==="o"){const o=S.objs[S.sel];
    h=`<h3>${o.name}</h3><p class="sub">${ST[o.st][0]}, ${fmt(o.price)} ₽ за ночь</p>`+cal(o);
    if(o.st==="busy")h+=`<div class="kv"><span>Гость</span><b>${o.g.n}</b><span>Срок</span><b>${o.g.to}</b><span>Оплачено</span><b>${fmt(o.g.sum)} ₽</b><span>Канал</span><b>${o.g.ch}</b><span>Код доступа</span><b>${o.code?"отправлен":"не отправлен"}</b></div><div class="btns">${o.code?"":`<button class="p" onclick="code(${o.id})">Отправить код</button>`}<button onclick="openChat('o')">Чат с гостем</button><button onclick="out(${o.id})">Выселить, отправить на уборку</button></div>`;
    else if(o.st==="clean")h+=o.cl==="need"?`<p class="q">Уборщица не назначена.</p><div class="btns"><button class="p" onclick="assign(${o.id})">Назначить уборщицу</button></div>`:o.cl==="work"?`<p class="q">Убирает ${o.cleaner}. В демо это занимает несколько секунд.</p>`:`<p class="q">${o.cleaner||"Уборщица"} закончила и прислала фото. Проверьте и примите.</p><div class="btns"><button class="p" onclick="done(${o.id})">Принять уборку</button></div>`;
    else h+=`<p class="q">Объект свободен. Новые заявки приходят сюда сами.</p><div class="btns"><button onclick="spawn()">Симулировать заявку</button></div>`}
  if(S.sheet==="cfg")h=cfgHtml();
  if(S.sheet==="c"&&cur())h=chatHtml();
  el.innerHTML=h?`<button class="x" onclick="closeSheet()" aria-label="Закрыть">×</button>`+h:"";
  el.classList.toggle("on",!!h);if(S.sheet==="c")msgs()}

function rowBtn(o){return o.st==="busy"?(o.code?`<button onclick="out(${o.id})">Выселить</button>`:`<button class="p" onclick="code(${o.id})">Отправить код</button>`):o.st==="clean"?(o.cl==="need"?`<button class="p" onclick="assign(${o.id})">Назначить уборщицу</button>`:o.cl==="work"?"Убирает "+o.cleaner:`<button class="p" onclick="done(${o.id})">Принять уборку</button>`):""}
function desk(){
  const r=S.req;
  $("#bn").innerHTML=r?`<div class="ban"><span><b>Новая заявка:</b> ${r.n}, ${r.o.name}, ${fmt(r.sum)} ₽ (${r.ch})</span><span class="btns"><button class="p" onclick="accept()">Заселить гостя</button><button onclick="reject()">Отклонить</button></span></div>`:"";
  $("#tb").innerHTML=S.objs.map(o=>`<tr><td>${o.name}</td><td><i class="dot" style="background:${ST[o.st][1]}"></i>${ST[o.st][0]}</td><td>${o.g?o.g.n:"—"}</td><td>${o.g?o.g.ch:"—"}</td><td>${o.g?fmt(o.g.sum)+" ₽":"—"}</td><td>${rowBtn(o)}</td></tr>`).join("");
  $("#lg").innerHTML=S.log.slice(0,6).map(l=>`<li><b>${l.t}</b> ${l.a} <em>✓ ${l.b}</em></li>`).join("")}
function focus(){
  const c=S.objs.find(o=>o.st==="clean"&&o.cl!=="work"),k=S.objs.find(o=>o.st==="busy"&&!o.code),r=S.req;let h;
  if(r)h=`<small>Следующий шаг</small><h2>Заявка от ${r.n}</h2><p>${r.ch}, ${r.o.name}, ${fmt(r.sum)} ₽</p><button class="p" onclick="accept()">Заселить гостя</button><button onclick="reject()">Отклонить</button>`;
  else if(c)h=`<small>Следующий шаг</small><h2>${c.name}: уборка</h2><p>${c.cl==="need"?"Назначьте уборщицу.":"Проверьте и примите, чтобы объект снова можно было бронировать."}</p><button class="p" onclick="${c.cl==="need"?"assign":"done"}(${c.id})">${c.cl==="need"?"Назначить уборщицу":"Принять уборку"}</button>`;
  else if(k)h=`<small>Следующий шаг</small><h2>${k.name}: код доступа</h2><p>Гость ${k.g.n} ещё не получил код.</p><button class="p" onclick="code(${k.id})">Отправить код</button>`;
  else h=`<small>Следующий шаг</small><h2>Всё спокойно</h2><p>Новых дел нет.</p><button onclick="spawn()">Симулировать заявку</button>`;
  $("#fc").innerHTML=h}
function foot(){const l=S.log[0];$("#ft").innerHTML=l?`<b>${l.t}</b> ${l.a} <em>✓ ${l.b}</em>`:"Нажмите на «!» у гостя или на любой дом"}
function render(){
  $("#occ").textContent=S.objs.filter(o=>o.st==="busy").length+" из "+S.objs.length;count();
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+S.view));
  $("#city").appendChild($("#gst"));$("#bg").innerHTML=ground();$("#bl").innerHTML=[...S.objs].sort((a,b)=>a.gx+a.gy-b.gx-b.gy).map(bld).join("");
  desk();focus();foot();world()}

document.querySelectorAll(".wsg button").forEach(b=>b.onclick=()=>{S.world=b.dataset.w;refresh()});
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;refresh()});
$("#city").addEventListener("click",e=>{
  if(e.target.closest("#gst")){if(S.req&&G&&G.mode==="wait")openReq();return}
  const b=e.target.closest("[data-id]");b?openObj(+b.dataset.id):closeSheet()});
render();requestAnimationFrame(tick);setTimeout(spawn,1800);
</script>
</body>
</html>
